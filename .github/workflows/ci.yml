name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # macos-26 is required, not a preference: the app's deployment target is
    # iOS 26.2, and macos-15 ships Xcode 16.4 whose newest simulator SDK is
    # iOS 18.5. On that image every build fails before compiling a single file
    # with "the range of supported deployment target versions is 12.0 to 18.5.99".
    runs-on: macos-26
    timeout-minutes: 60

    env:
      SCHEME: ArcticEdge
      # Present in the iOS 26.2, 26.4, and 26.5 runtimes on this image.
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro'

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      # Compile check first: it needs no simulator and fails fast on the most
      # common breakage. Strict concurrency is on for every target, so this also
      # catches actor isolation regressions.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      # The project treats warnings as work to be done, so surface any that
      # appear rather than letting them accumulate silently.
      - name: Fail on new warnings
        run: |
          if grep -E "warning:" build.log | grep -v "appintentsmetadataprocessor" | sort -u | grep .; then
            echo "::error::Build produced warnings"
            exit 1
          fi
          echo "No warnings."

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:ArcticEdgeTests \
            | tee unit-tests.log

      # UI tests relaunch the app per case and are slower, so they run last.
      # Three cases fail on one developer machine with a harness snapshot
      # timeout that does not reproduce as an app hang; this clean runner is the
      # arbiter for whether that is environmental or real.
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:ArcticEdgeUITests \
            | tee ui-tests.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            build.log
            unit-tests.log
            ui-tests.log
          retention-days: 7
          if-no-files-found: ignore
